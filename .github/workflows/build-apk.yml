name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java Environment ==="
          echo "JAVA_HOME: ${JAVA_HOME:-Not Set}"
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set." >&2
            exit 1
          fi

          java -version

          JAVA_RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected raw Java version string: $JAVA_RAW_VERSION"

          JAVA_MAJOR=$(echo "$JAVA_RAW_VERSION" | sed -E 's/^1\.([0-9]+).*/\1/; s/^([0-9]+).*/\1/')
          echo "Detected active Java major version: $JAVA_MAJOR"

          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Active Java major version could not be detected." >&2
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version is $JAVA_MAJOR, which is lower than 17." >&2
            exit 1
          fi

          echo "Java environment verified: Java $JAVA_MAJOR is active and satisfies the requirement (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "Checking temporary debug keystore..."
          if [ -f "./debug.keystore" ]; then
            echo "Debug keystore already exists at ./debug.keystore."
          else
            echo "Generating temporary debug keystore using Java 17 keytool..."
            "$JAVA_HOME/bin/keytool" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore." >&2
            exit 1
          fi

          echo "Temporary debug keystore confirmed present at ./debug.keystore."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK does not exist at $EXPECTED_APK" >&2
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files in app/build/outputs/apk:"
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file $EXPECTED_APK is empty (0 bytes)." >&2
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: Selected file does not have .apk extension: $EXPECTED_APK" >&2
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK path does not match expected app/build/outputs/apk/debug/app-debug.apk" >&2
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK")
          echo "APK successfully verified: $EXPECTED_APK ($APK_SIZE bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        run: |
          REPO_RAW="${GITHUB_REPOSITORY#*/}"
          REPO_CLEAN=$(echo "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$REPO_CLEAN" ]; then
            REPO_CLEAN="android-app"
          fi

          RUN_NUM="${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${REPO_CLEAN}-debug-build-${RUN_NUM}.apk"

          TEMP_RELEASE_DIR="${RUNNER_TEMP}/apk_release_staging"
          mkdir -p "$TEMP_RELEASE_DIR"

          ASSET_PATH="${TEMP_RELEASE_DIR}/${ASSET_NAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset preparation failed: $ASSET_PATH" >&2
            exit 1
          fi

          echo "Release asset prepared: $ASSET_PATH ($ASSET_NAME)"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI availability..."
          gh --version

          ASSET_PATH="${{ steps.prepare_release_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_release_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset not found or empty at: $ASSET_PATH" >&2
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Asset is not an .apk file: $ASSET_PATH" >&2
              exit 1
              ;;
          esac

          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES="### Debug APK Build #${GITHUB_RUN_NUMBER}

  - **Build Type**: Automatically generated debug APK
  - **Builder**: GitHub Actions
  - **Run Number**: ${GITHUB_RUN_NUMBER}
  - **Run Attempt**: ${GITHUB_RUN_ATTEMPT}
  - **Source Commit**: ${GITHUB_SHA}
  - **Intended Use**: Testing and Quality Assurance
  - **Production Status**: Not a Play Store production release
  - **Signing**: Signed only with a temporary debug keystore

  Download the debug APK below from the Assets section to install and test on your device."

          echo "Publishing release: $TITLE with tag: $TAG_NAME"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_release_asset.outputs.asset_name }}"
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== GitHub Release Succeeded ==="
            echo "Checking release with GitHub CLI..."
            gh release view "$TAG_NAME" || true

            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Name: $ASSET_NAME"

            {
              echo "### 🚀 Debug APK Successfully Published!"
              echo ""
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **Release Tag:** \`$TAG_NAME\`"
              echo "- **Release Asset:** \`$ASSET_NAME\`"
              echo ""
              echo "📱 **Download APK:** [View GitHub Release]($RELEASE_URL)"
              echo ""
              echo "> You can download the APK file directly on your mobile device from the Assets section on the release page."
              echo ""
              echo "📦 **Backup Artifact:** The standard GitHub Actions artifact \`app-debug-apk\` is also available in the run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "=== Notice: GitHub Release Publishing Did Not Complete ==="
            echo "Notice: Release publishing was not completed, but the APK build and artifact upload succeeded."
            echo "The GitHub Actions artifact 'app-debug-apk' is preserved and available for download."

            {
              echo "### ⚠️ Debug APK Build Notice"
              echo ""
              echo "The debug APK was built and verified successfully, and the GitHub Actions artifact has been uploaded."
              echo ""
              echo "📦 **Download Artifact:** Download the APK directly from the **Artifacts** section of this workflow run under the name **app-debug-apk**."
              echo ""
              echo "> To enable automatic GitHub Releases, ensure your repository has **Read and write permissions** enabled under **Settings > Actions > General > Workflow permissions**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
